[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agicore"
version = "0.1.0"
description = "AGIcore-v2 — multi-agent World Model orchestrator"
requires-python = ">=3.11"

[project.scripts]
agicore = "agicore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
