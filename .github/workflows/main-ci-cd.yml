name: AGIcore CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  changes:
    name: Detect service changes
    runs-on: ubuntu-latest
    outputs:
      # Output a JSON array of changed services, e.g., '["operator", "trader"]'
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate dynamic service filters
        id: generate_filters
        run: |
          chmod +x ./scripts/generate-ci-filters.py
          ./scripts/generate-ci-filters.py > .github/dynamic_filters.yml
      
      - name: Use paths-filter action
        uses: dorny/paths-filter@v2
        id: filter
        with:
          # Enable listing of changed files for the output
          list-files: 'json'
          # Use the dynamically generated filters
          filters: .github/dynamic_filters.yml

  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install Dependencies
        run: |
          export PYTHONPATH=$PWD
          for req in $(find services -name "requirements.txt"); do
            pip install -r $req
          done
      - name: Run test suite
        run: |
          export PYTHONPATH=$PWD
          chmod +x ./run_all_tests.sh
          ./run_all_tests.sh

  build-and-deploy:
    name: Build and Deploy Services
    runs-on: ubuntu-latest
    needs: [test, changes]
    # Only run on push to main and if there are services to deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.services != '[]'
    permissions:
      contents: 'read'
      id-token: 'write'
    strategy:
      fail-fast: false
      matrix:
        # The 'service' matrix is dynamically populated by the JSON output of the 'changes' job
        service: ${{ fromJson(needs.changes.outputs.services) }}
            
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: 'Setup Environment Variables for ${{ matrix.service }}'
        id: setup_vars
        run: |
          # Set image name, defaulting to service name
          DOCKER_IMAGE_NAME="${{ matrix.service }}"
          # Set Cloud Run service name based on convention
          CLOUD_RUN_SERVICE="bama-${{ matrix.service }}-agi-core-v2"
          
          echo "DOCKER_IMAGE_NAME=${DOCKER_IMAGE_NAME}" >> $GITHUB_ENV
          echo "CLOUD_RUN_SERVICE=${CLOUD_RUN_SERVICE}" >> $GITHUB_ENV
          echo "HEALTH_CHECK_PATH=/health" >> $GITHUB_ENV

      - name: 'Validate Secrets and Variables'
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY || '' }}" ]; then echo "::error::Secret GCP_SA_KEY is not set." && exit 1; fi
          if [ -z "${{ vars.GCP_PROJECT_ID || '' }}" ]; then echo "::error::Variable GCP_PROJECT_ID is not set." && exit 1; fi
          if [ -z "${{ vars.GCP_REGION || '' }}" ]; then echo "::error::Variable GCP_REGION is not set." && exit 1; fi
          if [ -z "${{ vars.GAR_REPOSITORY || '' }}" ]; then echo "::error::Variable GAR_REPOSITORY is not set." && exit 1; fi
      
      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build, Push, and Deploy ${{ matrix.service }}
        id: deploy
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
          # DOCKER_IMAGE_NAME is now set in the environment
          # CLOUD_RUN_SERVICE is now set in the environment
          IMAGE_TAG: ${{ github.sha }}
          # HEALTH_CHECK_PATH is now set in the environment
          GCP_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_RUN_SERVICE_ACCOUNT || '' }}
        run: |
          # The script will now use the environment variables set in the previous step
          chmod +x ./scripts/build-and-deploy.sh
          ./scripts/build-and-deploy.sh
      
      - name: Smoke Test
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} --region ${{ vars.GCP_REGION }} --project ${{ vars.GCP_PROJECT_ID }} --format 'value(status.url)')
          echo "Service URL: $SERVICE_URL"
          curl -f "$SERVICE_URL/"
          # Use the health check path from the environment
          curl -f "$SERVICE_URL/${{ env.HEALTH_CHECK_PATH }}"
