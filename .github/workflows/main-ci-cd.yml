name: AGIcore CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  changes:
    name: Detect service changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate dynamic service filters
        id: generate_filters
        run: |
          chmod +x ./scripts/generate-ci-filters.py
          ./scripts/generate-ci-filters.py > .github/dynamic_filters.yml
      
      - name: Use paths-filter action
        uses: dorny/paths-filter@v2
        id: filter
        with:
          list-files: 'json'
          filters: .github/dynamic_filters.yml

  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install Dependencies
        run: |
          export PYTHONPATH=$PWD
          for req in $(find services -name "requirements.txt"); do
            pip install -r $req
          done
      - name: Run test suite
        run: |
          export PYTHONPATH=$PWD
          chmod +x ./run_all_tests.sh
          ./run_all_tests.sh

  build:
    name: Build Service
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.services != '[]'
    permissions:
      contents: 'read'
      id-token: 'write'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build Image
        id: build
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
          DOCKER_IMAGE_NAME: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          chmod +x ./scripts/cicd/build.sh
          ./scripts/cicd/build.sh
      - name: Upload image url as artifact
        uses: actions/upload-artifact@v3
        with:
          name: image-url-${{ matrix.service }}
          path: image_url.txt
          retention-days: 1
      - name: Store image url
        run: echo "${{ steps.build.outputs.image_url }}" > image_url.txt

  deploy:
    name: Deploy Service
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: 'read'
      id-token: 'write'
    strategy:
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
      - name: Download image url artifact
        uses: actions/download-artifact@v3
        with:
          name: image-url-${{ matrix.service }}
      - name: Read image url
        id: image_url
        run: echo "::set-output name=url::$(cat image_url.txt)"
      - name: Deploy
        id: deploy
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: bama-${{ matrix.service }}-agi-core-v2
          IMAGE_URL: ${{ steps.image_url.outputs.url }}
          GCP_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_RUN_SERVICE_ACCOUNT || '' }}
        run: |
          chmod +x ./scripts/cicd/deploy.sh
          ./scripts/cicd/deploy.sh
      - name: Upload service url as artifact
        uses: actions/upload-artifact@v3
        with:
          name: service-url-${{ matrix.service }}
          path: service_url.txt
          retention-days: 1
      - name: Store service url
        run: echo "${{ steps.deploy.outputs.service_url }}" > service_url.txt

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy]
    strategy:
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Download service url artifact
        uses: actions/download-artifact@v3
        with:
          name: service-url-${{ matrix.service }}
      - name: Read service url
        id: service_url
        run: echo "::set-output name=url::$(cat service_url.txt)"
      - name: Smoke Test
        env:
          SERVICE_URL: ${{ steps.service_url.outputs.url }}
          HEALTH_CHECK_PATH: /health
        run: |
          chmod +x ./scripts/cicd/smoke-test.sh
          ./scripts/cicd/smoke-test.sh
      - name: Notify Slack on Success
        if: success()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": "Deployment of `${{ matrix.service }}` succeeded!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Deployment of `${{ matrix.service }}` succeeded! :tada:"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Service:*\n`${{ matrix.service }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n`Success`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*GitHub Run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  rollback:
    name: Rollback Service
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: failure()
    strategy:
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
      - name: Rollback
        run: |
          # Get the second to last revision
          REVISION=$(gcloud run revisions list --service=bama-${{ matrix.service }}-agi-core-v2 --region=${{ vars.GCP_REGION }} --project=${{ vars.GCP_PROJECT_ID }} --format='value(revision.name)' --sort-by=~creationTimestamp | sed -n '2p')
          gcloud run services update-traffic bama-${{ matrix.service }}-agi-core-v2 --to-revisions=$REVISION=100 --region=${{ vars.GCP_REGION }} --project=${{ vars.GCP_PROJECT_ID }} --quiet
      - name: Notify Slack on Failure
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": "Deployment of `${{ matrix.service }}` failed and has been rolled back.",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Deployment of `${{ matrix.service }}` failed and has been rolled back. :x:"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Service:*\n`${{ matrix.service }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n`Failed`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*GitHub Run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}


