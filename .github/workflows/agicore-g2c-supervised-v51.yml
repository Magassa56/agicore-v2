name: G2C V5.1 supervised integration

on:
  pull_request:
    paths:
      - .github/workflows/agicore-g2c-supervised-v51.yml
      - docs/evidence/EMA_PULLBACK_V2_G2C_SUPERVISION_V5_1.json
      - tools/ema_pullback_v2_g2c_supervised_v51.py
      - tools/ema_pullback_v2_g2c_supervisor.py
      - tools/ema_pullback_v2_g2c_verifier_worker_v5.py
      - src/agicore/trading/ema_pullback_v2_g2c_verifier_v5.py
      - tests/integration/test_ema_pullback_v2_g2c_supervised_v51.py

permissions:
  contents: read

jobs:
  exact-head:
    name: Small supervised integration on the PR head
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm exact tested revision
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git log -1 --format='tested commit %H tree %T'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing pinned synthetic test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          iniconfig==2.3.0 packaging==26.2 pluggy==1.6.0 pygments==2.20.0 pytest==9.0.3
      - name: Run small integration and verifier regressions only
        run: >-
          env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_RUNTIME_TOKEN
          -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
          python -B -m pytest -q -o addopts= -p no:cacheprovider
          tests/integration/test_ema_pullback_v2_g2c_supervised_v51.py
          tests/integration/test_ema_pullback_v2_g2c_cgroup_v4.py
          tests/integration/test_ema_pullback_v2_g2c_verifier_v5.py
          tests/integration/test_ema_pullback_v2_g2c_scaling.py::test_small_native_bundle_reconstructed_and_sealed
          tests/integration/test_ema_pullback_v2_g2c_scaling.py::test_small_forged_or_partial_bundle_fails_closed
          tests/integration/test_ema_pullback_v2_g2c_scaling.py::test_g2c_pages_are_exact_and_reordering_is_rejected
          tests/integration/test_ema_pullback_v2_g2c_scaling.py::test_supervisor_kills_worker_and_descendant
