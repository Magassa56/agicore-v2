name: G2C reference parity V2

on:
  pull_request:
    paths:
      - .github/workflows/agicore-g2c-reference-parity-v2.yml
      - docs/evidence/EMA_PULLBACK_V2_G2C_REFERENCE_PARITY_V2.json
      - tools/ema_pullback_v2_g2c_parity_v2.py
      - tests/integration/test_ema_pullback_v2_g2c_parity_v2.py

permissions:
  contents: read

jobs:
  exact-head:
    name: Small invented parity and supervision regressions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm tested commit
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git log -1 --format='tested commit %H tree %T'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          iniconfig==2.3.0 packaging==26.2 pluggy==1.6.0 pygments==2.20.0
          pytest==9.0.3 ruff==0.12.7
      - name: Check changed Python files
        run: |
          ruff check tools/ema_pullback_v2_g2c_parity_v2.py tests/integration/test_ema_pullback_v2_g2c_parity_v2.py
          git diff --check
      - name: Run small invented trials and historical supervisor regressions
        run: >-
          env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_RUNTIME_TOKEN
          -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
          python -B -m pytest --noconftest -c pyproject.toml -o addopts= -q -s
          tests/integration/test_ema_pullback_v2_g2c_parity_v2.py
          tests/integration/test_ema_pullback_v2_g2c_supervised_v51.py
          tests/integration/test_ema_pullback_v2_g2c_scaling.py
          tests/integration/test_ema_pullback_v2_g2c_cgroup_v4.py
          tests/integration/test_ema_pullback_v2_g2c_verifier_v5.py
